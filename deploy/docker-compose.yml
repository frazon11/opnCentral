services:
  opncentral:
    image: ghcr.io/frazon11/opncentral:latest
    container_name: OpnCentral
    restart: unless-stopped

    ports:
      - "8788:80"

    environment:
      TZ: ${TZ:-Europe/Brussels}
      APP_NAME: ${APP_NAME:-OpnCentral}
      APP_KEY: ${APP_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      ALERT_VPN: ${ALERT_VPN:-true}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-300}
      ALERT_FAILURE_THRESHOLD: ${ALERT_FAILURE_THRESHOLD:-2}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-opnCentral}
      NOTIFY_TO: ${NOTIFY_TO:-}

    volumes:
      - /volume1/docker/opncentral/data:/var/www/data
      - /volume1/docker/opncentral/backups:/var/www/backups

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/health.php || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s